<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTakip</title>
  <meta http-equiv="refresh" content="0; url=web/" />
  <script>
    (function () {
      var target = 'web/' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      text-align: center;
      padding: 24px;
    }
    .spin {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: s 0.75s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes s {
      to { transform: rotate(360deg); }
    }
    .t {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .st {
      font-size: 13px;
      color: #94a3b8;
    }
    a {
      color: #818cf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <div class="t">MyTakip Başlatılıyor...</div>
    <div class="st">Yönlendiriliyorsunuz. Beklemek istemiyorsanız <a href="web/">buraya dokunun</a>.</div>
  </div>
</body>
</html>
